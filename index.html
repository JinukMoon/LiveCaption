<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiveCaption">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <title>LiveCaption</title>
</head>
<body>
  <header id="bar">
    <span id="status" class="status idle"><i></i><b id="status-text">대기</b></span>
    <span id="timer"></span>
    <span id="engine" class="chip" hidden></span>
    <button id="settings-btn" class="icon-btn" aria-label="설정">⚙︎</button>
  </header>

  <div id="notice" hidden></div>

  <main id="feed">
    <div id="empty">
      <p id="empty-msg" class="big"></p>
      <p id="empty-key" hidden>먼저 ⚙︎ 설정에서 ElevenLabs API 키를 넣어 주세요</p>
    </div>
    <div id="segments"></div>
    <div id="live" class="seg live" hidden>
      <p class="ko"></p>
      <p class="en"></p>
    </div>
  </main>

  <button id="jump" hidden>↓ 최신</button>

  <footer>
    <button id="main-btn" class="main start">듣기 시작</button>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>설정</h2>

      <p class="note">설정 링크를 받았다면 아래 키 칸에 링크를 통째로 붙여넣고 저장하세요.</p>

      <label for="el-key">ElevenLabs API 키 <small>(필수 · 음성 인식)</small></label>
      <input id="el-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk_...">

      <label for="gm-key">Gemini API 키 <small>(선택 · 없으면 Google 번역)</small></label>
      <input id="gm-key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza...">

      <label for="gm-model">Gemini 모델</label>
      <input id="gm-model" type="text" autocomplete="off" spellcheck="false">

      <label for="terms">전문용어 <small>(쉼표·줄바꿈 구분 · 인식과 번역에 반영)</small></label>
      <textarea id="terms" rows="4" spellcheck="false"></textarea>
      <p id="terms-note" class="note"></p>

      <label for="font">글자 크기</label>
      <input id="font" type="range" min="0.8" max="1.6" step="0.05">

      <p id="engine-note" class="note"></p>

      <div class="row">
        <button type="button" id="clear-btn" class="ghost">기록 지우기</button>
        <button type="submit" id="save-btn" class="main">저장</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
